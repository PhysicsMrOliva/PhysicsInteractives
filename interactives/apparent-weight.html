<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apparent weight in an elevator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eaf1ee; --grid: #d3e0da; --panel: #ffffff; --ink: #15232b; --muted: #56666e; --line: #c4d3cc; --tint: #f3f7f5;
  --acc: #1f6fb4; --ok: #1a7f37; --okbg: #dff3e4; --bad: #b42318; --badbg: #fde7e4; --focus: #1f6fb4; --btn: #15232b; --btn-ink: #fff;
  --pos: #23913a; --vel: #d22b2b; --a: #1f6fb4; --fg: #2e7d32; --fn: #7a3fe0; --shaft: #d8e2dd; --car: #f4f7f6; --carline: #56666e; --skin: #f1c69b;
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171b; --grid: #1c292f; --panel: #162126; --ink: #e5eef0; --muted: #9aaab1; --line: #2b3b42; --tint: #1b282e;
  --acc: #5aa9ff; --ok: #6fd37a; --okbg: #17331f; --bad: #ff8a80; --badbg: #3d1c1a; --focus: #5aa9ff; --btn: #e5eef0; --btn-ink: #0f171b;
  --pos: #4cc76a; --vel: #ff6b6b; --a: #5aa9ff; --fg: #6fd37a; --fn: #b28cff; --shaft: #22323a; --car: #1b282e; --carline: #9aaab1; --skin: #e0b088; } }
:root[data-theme="dark"] {
  --bg: #0f171b; --grid: #1c292f; --panel: #162126; --ink: #e5eef0; --muted: #9aaab1; --line: #2b3b42; --tint: #1b282e;
  --acc: #5aa9ff; --ok: #6fd37a; --okbg: #17331f; --bad: #ff8a80; --badbg: #3d1c1a; --focus: #5aa9ff; --btn: #e5eef0; --btn-ink: #0f171b;
  --pos: #4cc76a; --vel: #ff6b6b; --a: #5aa9ff; --fg: #6fd37a; --fn: #b28cff; --shaft: #22323a; --car: #1b282e; --carline: #9aaab1; --skin: #e0b088; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; color: var(--ink); background-color: var(--bg); line-height: 1.5;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
header { max-width: 1180px; margin: 0 auto; padding: 28px 20px 8px; }
h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); margin: 0 0 4px; letter-spacing: -0.01em; }
header .back { display: inline-block; margin-bottom: 10px; color: var(--ink); font-weight: 700; }
header p { margin: 0; color: var(--muted); max-width: 88ch; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 12px 20px 48px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
nav.side { position: sticky; top: 12px; padding: 12px; }
@media (max-width: 900px) { nav.side { position: static; } }
nav.side ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
nav.side button { width: 100%; text-align: left; font: inherit; border: 0; background: none; color: var(--muted); padding: 6px 8px; border-radius: 6px; cursor: pointer; }
nav.side button[aria-current="page"] { background: var(--tint); color: var(--ink); font-weight: 700; }
nav.side button.done::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.card { padding: 18px 20px; } .card + .card { margin-top: 14px; }
h2 { margin: 0 0 8px; font-size: 1.45rem; } h3 { margin: 0 0 6px; font-size: 1.08rem; }
.hint { color: var(--muted); font-size: 0.93rem; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn { font: inherit; font-weight: 700; border: 2px solid var(--btn); background: var(--btn); color: var(--btn-ink); border-radius: 8px; padding: 7px 16px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); }
button.btn:disabled { opacity: 0.4; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
input[type=text], select { font: inherit; padding: 6px 9px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); }
input.num { width: 8ch; text-align: right; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.choices label { display: inline-flex; gap: 7px; align-items: center; border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
.choices label.right { border-color: var(--ok); background: var(--okbg); } .choices label.wrong { border-color: var(--bad); background: var(--badbg); }
.choices input { width: 17px; height: 17px; }
.fb { font-weight: 700; min-height: 1.3em; margin: 4px 0 0; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
.q { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.q h3 .n { color: var(--muted); font-weight: 700; margin-right: 6px; }
.probtop { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 680px) { .probtop { grid-template-columns: 1fr; } }
svg.elev { width: 100%; max-width: 230px; height: auto; display: block; border-radius: 8px; background: var(--tint); border: 1px solid var(--line); }
.given { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; }
.given b { font-weight: 700; }
.work { background: var(--tint); border-left: 4px solid var(--acc); border-radius: 0 8px 8px 0; padding: 10px 14px; margin-top: 10px; }
.work .ln { font-family: "Cambria Math", "Times New Roman", serif; font-size: 1.12rem; margin: 2px 0; }
.fbdwrap { display: grid; grid-template-columns: 200px 1fr; gap: 14px; align-items: center; margin-top: 10px; }
@media (max-width: 560px) { .fbdwrap { grid-template-columns: 1fr; } }
svg.fbd { width: 200px; height: 220px; background: var(--tint); border: 1px solid var(--line); border-radius: 8px; }
.vt { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-top: 6px; }
.vt label { border: 1.5px solid var(--line); border-radius: 8px; padding: 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 0.85rem; }
.vt label.right { border-color: var(--ok); background: var(--okbg); } .vt label.wrong { border-color: var(--bad); background: var(--badbg); }
.vt input { position: absolute; opacity: 0; pointer-events: none; }
.vt label:has(input:checked) { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc) inset; }
.vt label.right:has(input:checked) { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok) inset; }
.vt svg { width: 110px; height: 70px; }
table.data { border-collapse: collapse; width: 100%; margin-top: 8px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: middle; }
.ride { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .ride { grid-template-columns: 1fr; } }
canvas.g { width: 100%; height: 118px; display: block; background: var(--tint); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.readout { display: flex; flex-wrap: wrap; gap: 6px 16px; font-weight: 700; margin: 8px 0; }
input[type=range] { width: 100%; accent-color: var(--acc); }
.sort { display: grid; gap: 6px; }
.sort .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.gchoice { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .gchoice { grid-template-columns: 1fr; } }
.gchoice label { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; display: grid; gap: 4px; }
.gchoice label:has(input:checked) { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc) inset; }
.gchoice label.right { border-color: var(--ok); background: var(--okbg); } .gchoice label.wrong { border-color: var(--bad); background: var(--badbg); }
.gchoice svg { width: 100%; height: 90px; }
.done-hero { text-align: center; border: 3px solid var(--ok); }
.done-hero .big { font-size: 3rem; color: var(--ok); line-height: 1; }
.donelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 14px; text-align: left; max-width: 760px; margin: 12px auto; }
.donelist span.y::before { content: "✓ "; color: var(--ok); font-weight: 700; } .donelist span.n::before { content: "○ "; color: var(--muted); }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <a class="back" href="../interactives.html">Back to Interactives</a>
  <h1>Apparent weight in an elevator</h1>
  <p>Why do you feel heavier or lighter in an elevator? A bathroom scale measures the <b>normal force</b> pushing up on you, your <b>apparent weight</b>. Use <b>g = 9.8 N/kg</b>, ΣF = F<sub>net</sub>, and Newton’s 2nd Law, F<sub>net</sub> = ma. Take <b>up as positive</b>.</p>
</header>
<div class="wrap">
  <nav class="panel side" aria-label="Sections"><ol id="nav"></ol></nav>
  <main id="main"></main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const G = 9.8, M = 70, FG = 686;
  const fmt = (v, d = 1) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
  const parse = s => Number(String(s).trim().replace("−", "-").replace(",", ".").replace(/\s*(m\/s²|m\/s2|n)$/i, ""));

  // ---------- the nine worksheet moments (70 kg teacher, Fg = 686 N) ----------
  // v: direction of motion (1 up, -1 down, 0 at rest), a: acceleration (m/s², up +), N: scale reading
  const P = [
    { id: "p1", title: "At rest, before moving", group: "Going up", v: 0, a: 0, N: 686, known: "N", text: "The elevator has not started moving yet. There is a normal force of <b>686 N</b> on the teacher, as measured by the scale. Find the acceleration.", vt: "zero" },
    { id: "p2", title: "Starting to go up", group: "Going up", v: 1, a: 2.2, N: 840, known: "N", text: "The elevator has just started to <b>accelerate upward</b>, and the scale pushes up with a normal force of <b>840 N</b>. Find the acceleration.", vt: "upFaster" },
    { id: "p3", title: "Constant velocity up", group: "Going up", v: 1, a: 0, N: 686, known: "a", text: "The elevator is moving at a <b>constant velocity</b> as it rises. Find the normal force shown on the scale.", vt: "upConst" },
    { id: "p4", title: "Slowing down going up", group: "Going up", v: 1, a: -2.2, N: 532, known: "a", text: "The elevator is still moving up but has just started to <b>slow down at a rate of 2.2 m/s²</b> as it approaches the top floor. Find the normal force shown on the scale.", vt: "upSlower" },
    { id: "p5", title: "Stopped at the top", group: "Going up", v: 0, a: 0, N: 686, known: "N", text: "The elevator has just stopped at the top floor. The scale shows a normal force of <b>686 N</b>. Find the acceleration.", vt: "zero" },
    { id: "p6", title: "Free fall (the cable snaps!)", group: "Free fall", v: -1, a: -9.8, N: 0, known: "free", text: "Oh snap! The elevator’s cable has broken, and the elevator, teacher and scale are all in <b>free fall</b>. Find the acceleration and the normal force the scale shows.", vt: "downFaster" },
    { id: "p7", title: "Starting to go down", group: "Going down", v: -1, a: -2.2, N: 532, known: "N", text: "The elevator has just started to <b>accelerate downward</b>, and the scale pushes up on the teacher with a normal force of <b>532 N</b>. Find the acceleration.", vt: "downFaster" },
    { id: "p8", title: "Constant velocity down", group: "Going down", v: -1, a: 0, N: 686, known: "a", text: "The elevator is moving at a <b>constant velocity</b> as it descends. Find the normal force shown on the scale.", vt: "downConst" },
    { id: "p9", title: "Slowing down going down", group: "Going down", v: -1, a: 2.2, N: 840, known: "N", text: "The elevator is moving down but slowing as it approaches the 1st floor. The scale reads a normal force of <b>840 N</b>. Find the acceleration.", vt: "downSlower" }
  ];
  const VT = { zero: "At rest (v = 0)", upFaster: "Up, speeding up", upConst: "Up, constant speed", upSlower: "Up, slowing down", downFaster: "Down, speeding up", downConst: "Down, constant speed", downSlower: "Down, slowing down" };
  const vtPath = k => ({ zero: "M8 35 H102", upFaster: "M8 35 L102 8", upConst: "M8 18 H102", upSlower: "M8 8 L102 35", downFaster: "M8 35 L102 62", downConst: "M8 52 H102", downSlower: "M8 62 L102 35" }[k]);
  const vtSVG = k => `<svg viewBox="0 0 110 70" aria-hidden="true"><line x1="8" y1="35" x2="106" y2="35" stroke="${css("--muted")}" stroke-width="1"/><line x1="8" y1="4" x2="8" y2="66" stroke="${css("--muted")}" stroke-width="1"/>
    <text x="1" y="12" font-size="9" fill="${css("--muted")}">+</text><text x="2" y="66" font-size="9" fill="${css("--muted")}">−</text><path d="${vtPath(k)}" stroke="${css("--vel")}" stroke-width="3" fill="none"/></svg>`;

  // ---------- saved progress ----------
  const KEY = "apparent-weight-v1";
  let S = { name: "", sec: "data", a: {}, finished: null };
  try { const x = JSON.parse(localStorage.getItem(KEY) || "null"); if (x && x.a) S = x; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const A = id => (S.a[id] = S.a[id] || {});

  // ---------- sections ----------
  const SECS = [{ id: "data", title: "1. Real elevator data" }, ...P.map((p, i) => ({ id: p.id, title: `${i + 2}. ${p.title}` })),
    { id: "ride", title: "11. Ride the elevator" }, { id: "sum", title: "12. Summarize" }, { id: "finish", title: "Finish" }];
  const secDone = id => id === "data" ? dataDone() : id === "ride" ? !!A("ride").seen : id === "sum" ? sumDone() : id === "finish" ? false : probDone(P.find(p => p.id === id));
  function renderNav() {
    $("nav").innerHTML = SECS.map(s => `<li><button data-s="${s.id}" ${S.sec === s.id ? 'aria-current="page"' : ""} class="${secDone(s.id) ? "done" : ""}">${s.title}</button></li>`).join("");
  }
  $("nav").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) go(b.dataset.s); });
  function go(id) { S.sec = id; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  const nextBtn = id => { const i = SECS.findIndex(s => s.id === id), n = SECS[i + 1]; return n ? `<div class="bar" style="margin-top:16px"><button class="btn" data-go="${n.id}">Next: ${esc(n.title.replace(/^\d+\.\s*/, ""))} ▶</button></div>` : ""; };
  let stopAnim = null;
  function render() {
    if (stopAnim) { stopAnim(); stopAnim = null; }
    renderNav();
    const id = S.sec;
    if (id === "data") renderData(); else if (id === "ride") renderRide(); else if (id === "sum") renderSum(); else if (id === "finish") renderFinish(); else renderProb(P.find(p => p.id === id));
    $("main").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  }
  const choice = (name, opts, val, mark) => `<div class="choices">${opts.map(([v, t]) => `<label class="${mark && val === v ? (mark === v ? "right" : "wrong") : ""}"><input type="radio" name="${name}" value="${v}" ${val === v ? "checked" : ""}> <span>${t}</span></label>`).join("")}</div>`;

  // ---------- 1. real data ----------
  const RD = [["At rest at the bottom", 693, "normal"], ["Starting to go up", 714, "heavier"], ["Constant velocity up", 692, "normal"], ["Slowing down moving up", 664, "lighter"], ["Stopped at the top", 692, "normal"]];
  const RM = 692 / G;
  const rdA = r => (r[1] - 692) / RM;
  function dataDone() { const a = A("data"); return RD.every((r, i) => a["f" + i] === r[2] && Math.abs(parse(a["a" + i]) - rdA(r)) <= 0.03); }
  function renderData() {
    const a = A("data");
    $("main").innerHTML = `<section class="panel card"><h2>Real elevator data: going up</h2>
      <p>A student stood on a force scale during a real elevator ride up. Their <b>actual weight is 692 N</b> (that’s F<sub>g</sub> = mg). The table shows the average scale reading in each part of the ride.</p>
      <p class="hint">Their mass: m = F<sub>g</sub> / g = 692 N ÷ 9.8 N/kg = <b>70.6 kg</b>. To find the acceleration: ΣF = F<sub>N</sub> − F<sub>g</sub> = ma, so a = (F<sub>N</sub> − F<sub>g</sub>) / m.</p>
      <div style="overflow-x:auto"><table class="data"><thead><tr><th>Part of the ride</th><th>Scale reading</th><th>They feel…</th><th>Acceleration (m/s²)</th></tr></thead><tbody>
      ${RD.map((r, i) => { const f = a["f" + i], av = a["a" + i], okA = av != null && av !== "" && Math.abs(parse(av) - rdA(r)) <= 0.03;
        return `<tr><td>${r[0]}</td><td><b>${r[1]} N</b></td><td><select data-f="${i}" aria-label="How they feel: ${r[0]}" style="${f ? `border-color:${f === r[2] ? "var(--ok)" : "var(--bad)"}` : ""}"><option value="">choose…</option>${["heavier", "normal", "lighter"].map(o => `<option ${f === o ? "selected" : ""}>${o}</option>`).join("")}</select></td>
          <td><input type="text" class="num" data-a="${i}" value="${esc(av || "")}" inputmode="decimal" aria-label="Acceleration: ${r[0]}" style="${av ? `border-color:${okA ? "var(--ok)" : "var(--bad)"}` : ""}"> ${okA ? "✓" : ""}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p class="hint">Round to 2 decimal places. Use a negative sign for downward acceleration.</p>
      <p class="fb ${dataDone() ? "ok" : ""}" id="dfb">${dataDone() ? "All correct! Even a small change in the scale reading means the elevator is accelerating." : ""}</p>
      ${dataDone() ? `<div class="work"><b>Notice:</b> when the scale reads more than 692 N the acceleration is up (+); less than 692 N, it’s down (−); exactly 692 N, there’s no acceleration, even while moving at constant velocity.</div>` : ""}
      ${nextBtn("data")}</section>`;
    // redraw after the browser finishes moving focus (tabbing from one box to the next)
    const later = () => setTimeout(() => { const f = document.activeElement && document.activeElement.dataset; const key = f && (f.f != null ? "[data-f='" + f.f + "']" : f.a != null ? "[data-a='" + f.a + "']" : null);
      renderData(); renderNav(); if (key && $("main").querySelector(key)) $("main").querySelector(key).focus(); }, 0);
    $("main").querySelectorAll("[data-f]").forEach(s => s.addEventListener("change", e => { a["f" + e.target.dataset.f] = e.target.value; save(); later(); }));
    $("main").querySelectorAll("[data-a]").forEach(s => s.addEventListener("change", e => { a["a" + e.target.dataset.a] = e.target.value; save(); later(); }));
  }

  // ---------- elevator picture (SVG), animated for a moment ----------
  function elevSVG(state) {   // state: { y: car offset px, v, a, N (or null), cut, float }
    const c = { ink: css("--ink"), muted: css("--muted"), shaft: css("--shaft"), car: css("--car"), line: css("--carline"), vel: css("--vel"), a: css("--a"), skin: css("--skin") };
    const cy = 70 + state.y, arrow = (x, y1, y2, col, lab) => y1 === y2 ? "" : `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2 + (y2 < y1 ? 8 : -8)}" stroke="${col}" stroke-width="4"/><path d="M${x} ${y2} l-7 ${y2 < y1 ? 11 : -11} h14 z" fill="${col}"/><text x="${x + 9}" y="${(y1 + y2) / 2 + 4}" font-size="13" font-weight="700" fill="${col}">${lab}</text>`;
    const vLen = state.v === 0 ? 0 : 34 * Math.sign(state.v), aLen = Math.abs(state.a) < 1e-6 ? 0 : (Math.abs(state.a) > 5 ? 50 : 30) * Math.sign(state.a);
    const fy = state.float ? -6 : 0;
    return `<svg class="elev" viewBox="0 0 230 300" role="img" aria-label="Elevator with the teacher standing on a scale">
      <rect x="40" y="0" width="110" height="300" fill="${c.shaft}"/>
      ${state.cut ? `<line x1="95" y1="0" x2="95" y2="${cy - 40}" stroke="${c.muted}" stroke-width="2" stroke-dasharray="4 4"/><text x="100" y="${Math.max(14, cy - 46)}" font-size="12" font-weight="700" fill="${c.vel}">snap!</text>` : `<line x1="95" y1="0" x2="95" y2="${cy}" stroke="${c.ink}" stroke-width="2.5"/>`}
      <rect x="50" y="${cy}" width="90" height="140" rx="4" fill="${c.car}" stroke="${c.line}" stroke-width="2"/>
      <g transform="translate(0 ${fy})">
        <circle cx="95" cy="${cy + 36}" r="11" fill="${c.skin}" stroke="${c.ink}" stroke-width="1.5"/>
        <line x1="95" y1="${cy + 47}" x2="95" y2="${cy + 90}" stroke="${c.ink}" stroke-width="3"/>
        <line x1="95" y1="${cy + 58}" x2="${state.float ? 76 : 80}" y2="${cy + (state.float ? 50 : 76)}" stroke="${c.ink}" stroke-width="3"/><line x1="95" y1="${cy + 58}" x2="${state.float ? 114 : 110}" y2="${cy + (state.float ? 50 : 76)}" stroke="${c.ink}" stroke-width="3"/>
        <line x1="95" y1="${cy + 90}" x2="84" y2="${cy + 118}" stroke="${c.ink}" stroke-width="3"/><line x1="95" y1="${cy + 90}" x2="106" y2="${cy + 118}" stroke="${c.ink}" stroke-width="3"/>
      </g>

  // ---------- finish ----------
  function renderFinish() {
    const all = SECS.filter(s => s.id !== "finish"), done = all.filter(s => secDone(s.id)).length, complete = done === all.length;
    if (complete && !S.finished) { S.finished = new Date().toISOString(); save(); }
    $("main").innerHTML = `<section class="panel card ${complete ? "done-hero" : ""}">${complete ? `<div class="big" aria-hidden="true">✓</div>` : ""}<h2 style="${complete ? "" : ""}">${complete ? "Apparent weight: complete" : "Almost there"}</h2>
      <p><label>Your name: <input type="text" id="nm" value="${esc(S.name)}" autocomplete="name" style="min-width:220px"></label></p>
      ${complete ? `<p>Finished ${new Date(S.finished).toLocaleDateString()} at ${new Date(S.finished).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</p>` : `<p>${done} of ${all.length} sections complete. Finish the ones marked ○.</p>`}
      <div class="donelist">${all.map(s => `<span class="${secDone(s.id) ? "y" : "n"}">${esc(s.title)}</span>`).join("")}</div>
      ${complete ? `<p class="hint">Take a screenshot of this screen to turn in.</p>` : ""}</section>`;
    $("nm").addEventListener("input", e => { S.name = e.target.value; save(); });
  }

  addEventListener("resize", () => { if (S.sec === "ride") { const v = $("rt"); if (v) v.dispatchEvent(new Event("input")); } });
  render();
})();
</script>
<!-- lock check: hides this interactive until the teacher opens it (settings in ../availability.json) -->
<script>
(function () {
  var id = location.pathname.split("/").pop().replace(".html", "");
  fetch("../availability.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (cfg) {
      if (!cfg || !cfg.labs || cfg.labs[id] !== false) return;
      var teacher = false; try { teacher = localStorage.getItem("teacherPreview") === "1"; } catch (e) {}
      var font = "font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;";
      if (teacher) {
        var b = document.createElement("div");
        b.setAttribute("role", "status");
        b.style.cssText = font + "position:sticky;top:0;z-index:50;background:#7a3fe0;color:#fff;font-weight:700;text-align:center;padding:8px 12px;";
        b.textContent = "Teacher preview: this interactive is locked for students.";
        document.body.prepend(b);
        return;
      }
      var o = document.createElement("div");
      o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-labelledby", "lockTitle");
      o.style.cssText = font + "position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:var(--bg,#eaf1ee);";
      o.innerHTML = '<div style="max-width:520px;background:var(--panel,#fff);color:var(--ink,#15232b);border:1px solid var(--line,#c4d3cc);border-radius:12px;padding:28px;text-align:center">' +
        '<h1 id="lockTitle" style="margin:0 0 8px;font-size:1.6rem">Not open yet</h1>' +
        '<p style="margin:0 0 18px;line-height:1.5">This interactive opens after we do the class activity that goes with it. Check back then!</p>' +
        '<a href="../interactives.html" style="display:inline-block;font-weight:700;padding:8px 18px;border-radius:8px;background:var(--ink,#15232b);color:var(--panel,#fff);text-decoration:none">Back to Interactives</a></div>';
      document.body.appendChild(o);
      document.documentElement.style.overflow = "hidden";
      Array.prototype.forEach.call(document.body.children, function (el) { if (el !== o) el.setAttribute("aria-hidden", "true"); });
    })
    .catch(function () {});
})();
</script>
