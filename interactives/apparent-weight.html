<body>
<header>
  <a class="back" href="../interactives.html">Back to Interactives</a>
  <h1>Apparent weight in an elevator</h1>
  <p>Why do you feel heavier or lighter in an elevator? A bathroom scale measures the <b>normal force</b> pushing up on you, your <b>apparent weight</b>. Use <b>g = 9.81 N/kg</b>, ΣF = F<sub>net</sub>, and Newton’s 2nd Law, F<sub>net</sub> = ma. As usual, we will use <b>“up is positive.”</b></p>
</header>
<div class="wrap">
  <nav class="panel side" aria-label="Sections"><ol id="nav"></ol></nav>
  <main id="main"></main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const G = 9.81;
  const M = (() => { try { const x = JSON.parse(localStorage.getItem("apparent-weight-v1") || "null");
      if (x && x.mass) return x.mass; if (x && x.a && Object.keys(x.a).length) return 70; } catch (e) {}
    return 50 + Math.floor(Math.random() * 41); })();   // a random mass from 50 to 90 kg, so neighbours have different numbers
  const FG = M * G;
  const fmtN = v => Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1);
  const WS = () => fmtN(FG), NUP = () => fmtN(FG + M * 2.2), NDN = () => fmtN(FG - M * 2.2);   // weight and the two given readings, as text
  const fmt = (v, d = 1) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
  const parse = s => Number(String(s).trim().replace("−", "-").replace(",", ".").replace(/\s*(m\/s²|m\/s2|n)$/i, ""));

  // ---------- the nine moments (the student’s mass M, Fg = M × 9.81 N/kg) ----------
  // v: direction of motion (1 up, -1 down, 0 at rest), a: acceleration (m/s², up +), N: scale reading
  const P = [
    { id: "p1", title: "At rest at the bottom", group: "Going up", v: 0, a: 0, N: FG, known: "N", text: `The elevator is at rest at the bottom and hasn’t started moving yet. The scale shows a normal force of <b>${WS()} N</b> on the student. Find the acceleration.`, vt: "zero" },
    { id: "p2", title: "Starting to go up", group: "Going up", v: 1, a: 2.2, N: FG + M * 2.2, known: "N", text: `The elevator has just started to <b>accelerate upward</b>, and the scale pushes up with a normal force of <b>${NUP()} N</b>. Find the acceleration.`, vt: "upFaster" },
    { id: "p3", title: "Constant velocity up", group: "Going up", v: 1, a: 0, N: FG, known: "a", text: `The elevator is moving at a <b>constant velocity</b> as it rises. Find the normal force shown on the scale.`, vt: "upConst" },
    { id: "p4", title: "Slowing down going up", group: "Going up", v: 1, a: -2.2, N: FG - M * 2.2, known: "a", text: `The elevator is still moving up but has just started to <b>slow down at a rate of 2.2 m/s²</b> as it approaches the top floor. Find the normal force shown on the scale.`, vt: "upSlower" },
    { id: "p5", title: "Stopped at the top", group: "Going up", v: 0, a: 0, N: FG, known: "N", text: `The elevator has just stopped at the top floor. The scale shows a normal force of <b>${WS()} N</b>. Find the acceleration.`, vt: "zero" },
    { id: "p7", title: "Starting to go down", group: "Going down", v: -1, a: -2.2, N: FG - M * 2.2, known: "N", text: `The elevator has just started to <b>accelerate downward</b> from the top floor, and the scale pushes up on the student with a normal force of <b>${NDN()} N</b>. Find the acceleration.`, vt: "downFaster" },
    { id: "p8", title: "Constant velocity down", group: "Going down", v: -1, a: 0, N: FG, known: "a", text: `The elevator is moving at a <b>constant velocity</b> as it descends. Find the normal force shown on the scale.`, vt: "downConst" },
    { id: "p9", title: "Slowing down going down", group: "Going down", v: -1, a: 2.2, N: FG + M * 2.2, known: "N", text: `The elevator is moving down but slowing as it approaches the 1st floor. The scale reads a normal force of <b>${NUP()} N</b>. Find the acceleration.`, vt: "downSlower" },
    { id: "p6", title: "What if the cable snapped?", group: "What if…?", v: -1, a: -G, N: 0, known: "free", text: `Let’s suppose that instead of being lowered from the top, the cable <b>snapped</b>! The elevator, the student and the scale are all in <b>free fall</b>. Find the acceleration and the normal force the scale shows.`, vt: "downFaster" }
  ];
  const VT = { zero: "At rest (v = 0)", upFaster: "Up, speeding up", upConst: "Up, constant speed", upSlower: "Up, slowing down", downFaster: "Down, speeding up", downConst: "Down, constant speed", downSlower: "Down, slowing down" };
  const vtPath = k => ({ zero: "M8 35 H102", upFaster: "M8 35 L102 8", upConst: "M8 18 H102", upSlower: "M8 8 L102 35", downFaster: "M8 35 L102 62", downConst: "M8 52 H102", downSlower: "M8 62 L102 35" }[k]);
  const vtSVG = k => `<svg viewBox="0 0 110 70" aria-hidden="true"><line x1="8" y1="35" x2="106" y2="35" stroke="${css("--muted")}" stroke-width="1"/><line x1="8" y1="4" x2="8" y2="66" stroke="${css("--muted")}" stroke-width="1"/>
    <text x="1" y="12" font-size="9" fill="${css("--muted")}">+</text><text x="2" y="66" font-size="9" fill="${css("--muted")}">−</text><path d="${vtPath(k)}" stroke="${css("--vel")}" stroke-width="3" fill="none"/></svg>`;

  // ---------- saved progress ----------
  const KEY = "apparent-weight-v1";
  let S = { name: "", period: "", sec: "data", a: {}, finished: null };
  try { const x = JSON.parse(localStorage.getItem(KEY) || "null"); if (x && x.a) S = x; } catch (e) {}
  const save = () => { S.mass = M; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const A = id => (S.a[id] = S.a[id] || {});

  // ---------- sections ----------
  const SECS = [{ id: "data", title: "1. Predict: up and down" }, ...P.map((p, i) => ({ id: p.id, title: `${i + 2}. ${p.title}` })),
    { id: "ride", title: "11. Ride the elevator" }, { id: "sum", title: "12. Summarize" }, { id: "finish", title: "Finish" }];
  const secDone = id => id === "data" ? dataDone() : id === "ride" ? !!A("ride").seen : id === "sum" ? sumDone() : id === "finish" ? false : probDone(P.find(p => p.id === id));
  // parts unlock in order: a student can open any finished part and their current (first unfinished) part
  const firstOpen = () => { const i = SECS.findIndex(x => x.id !== "finish" && !secDone(x.id)); return i < 0 ? SECS.length - 1 : i; };
  const canOpen = id => SECS.findIndex(x => x.id === id) <= firstOpen();
  function renderNav() {
    $("nav").innerHTML = SECS.map(s => { const open = canOpen(s.id);
      return `<li><button data-s="${s.id}" ${S.sec === s.id ? 'aria-current="page"' : ""} ${open ? "" : 'disabled aria-disabled="true" title="Finish the earlier parts first"'} class="${secDone(s.id) ? "done" : open ? "" : "locked"}">${s.title}</button></li>`; }).join("");
    // the Next button turns on as soon as the current part is finished
    const nb = $("main").querySelector("[data-go]"); if (nb) { const ok = secDone(S.sec); nb.disabled = !ok; const h = $("nexthint"); if (h) h.style.display = ok ? "none" : ""; }
  }
  $("nav").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) go(b.dataset.s); });
  // every “Next” button, including ones redrawn after an answer, is handled here
  $("main").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });
  function go(id) { if (!canOpen(id)) return; S.sec = id; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  const nextBtn = id => { const i = SECS.findIndex(s => s.id === id), n = SECS[i + 1]; return n ? `<div class="bar" style="margin-top:16px"><button class="btn" data-go="${n.id}" ${secDone(id) ? "" : "disabled"}>Next: ${esc(n.title.replace(/^\d+\.\s*/, ""))} ▶</button><span class="hint" id="nexthint" style="${secDone(id) ? "display:none" : ""}">Finish this part to go on.</span></div>` : ""; };
  let stopAnim = null;
  function render() {
    if (stopAnim) { stopAnim(); stopAnim = null; }
    renderNav();
    let id = S.sec;
    if (!S.name.trim() || !(S.period || "").trim()) { renderStart(); return; }
    if (!canOpen(S.sec)) { S.sec = SECS[firstOpen()].id; id = S.sec; save(); renderNav(); }
    if (id === "data") renderData(); else if (id === "ride") renderRide(); else if (id === "sum") renderSum(); else if (id === "finish") renderFinish(); else renderProb(P.find(p => p.id === id));
  }
  const choice = (name, opts, val, mark) => `<div class="choices">${opts.map(([v, t]) => `<label class="${mark && val === v ? (mark === v ? "right" : "wrong") : ""}"><input type="radio" name="${name}" value="${v}" ${val === v ? "checked" : ""}> <span>${t}</span></label>`).join("")}</div>`;

  const RIDE = [["At rest", 1.5, 0], ["Speeding up, going up", 2, 2.2], ["Constant velocity up", 4, 0], ["Slowing down, going up", 2, -2.2], ["Stopped at the top", 2, 0],
    ["Speeding up, going down", 2, -2.2], ["Constant velocity down", 4, 0], ["Slowing down, going down", 2, 2.2], ["Stopped at the bottom", 1.5, 0]];
  const RT = RIDE.reduce((t, r) => t + r[1], 0);
  function rideAt(t) {   // y, v, a, phase index
    let y = 0, v = 0, tt = 0;
    for (let i = 0; i < RIDE.length; i++) { const [, d, a] = RIDE[i];
      if (t <= tt + d) { const u = t - tt; return { y: y + v * u + 0.5 * a * u * u, v: v + a * u, a, i }; }
      y += v * d + 0.5 * a * d * d; v += a * d; tt += d; }
    return { y, v, a: 0, i: RIDE.length - 1 };
  }
  const YMAX = rideAt(10.5).y;   // height of the top floor (the elevator is stopped there from 9.5 s to 11.5 s)
  // ---------- 1. predictions ----------
  const RD = [["At rest at the bottom", FG, "normal"], ["Starting to go up", FG + M * 2.2, "heavier"], ["Constant velocity up", FG, "normal"], ["Slowing down moving up", FG - M * 2.2, "lighter"], ["Stopped at the top", FG, "normal"],
    ["Starting to go down", FG - M * 2.2, "lighter"], ["Constant velocity down", FG, "normal"], ["Slowing down moving down", FG + M * 2.2, "heavier"], ["Stopped at the bottom", FG, "normal"]];   // N = m(g + a)
  const RDIR = { heavier: "up", normal: "zero", lighter: "down" };
  const DIRS = [["up", "Up (+)"], ["zero", "Zero"], ["down", "Down (−)"]];
  const rdOK = (a, i) => a["f" + i] === RD[i][2] && a["d" + i] === RDIR[RD[i][2]];
  function dataDone() { const a = A("data"); return !!a.wOK && !!a.revealed; }
  function bindWeight(a) {
    const chk = () => { a.w = $("wt").value; a.wTried = true; const v = parse(a.w); a.wOK = isFinite(v) && a.w !== "" && Math.abs(v - FG) <= 0.6; if (a.wFirst == null) a.wFirst = a.w; save(); renderData(); renderNav(); };
    $("chkw").addEventListener("click", chk); $("wt").addEventListener("keydown", e => { if (e.key === "Enter") chk(); });
    $("wt").addEventListener("input", e => { a.w = e.target.value; save(); });
  }   // complete once the predictions are locked in (they aren't marked)
  function renderData() {
    { const a0 = A("data"); if (!a0.played && (a0.revealed || RD.some((r, i) => a0["f" + i] || a0["d" + i]))) a0.played = true; }
    if (stopAnim) { stopAnim(); stopAnim = null; }
    const a = A("data"), rev = !!a.revealed, all = RD.every((r, i) => a["f" + i] && a["d" + i]);
    const mark = () => "";
    const watched = !!A("data").played;
    $("main").innerHTML = `<section class="panel card"><h2>Predict: an elevator ride up and down</h2>
      <p>A student with a mass of <b>${M} kg</b> steps onto a force scale in an elevator on the 1st floor, rides up to the top floor and back down. The scale measures their <b>apparent weight</b>: how hard the scale pushes up on them.</p>

  const ORDER = { y: [1, 0, 2], v: [2, 1, 0], a: [0, 2, 1] };
  const REV = [...RD.map((r, i) => ({ label: r[0], feel: r[2], dir: RDIR[r[2]], orig: i })), { label: "The cable snapped (free fall)", feel: "weightless", dir: "down", orig: null }];
  const REFMIN = 120;
  const revOK = (a, i) => a["rf" + i] === REV[i].feel && a["rd" + i] === REV[i].dir;
  const wrongOrig = () => { const d = A("data"); return RD.map((r, i) => i).filter(i => !(d["f" + i] === RD[i][2] && d["d" + i] === RDIR[RD[i][2]])); };
  function sumDone() { const a = A("sum"); return FILL.every((f, i) => a["f" + i] === f[1]) && REV.every((r, i) => revOK(a, i)) && (a.refl || "").trim().length >= REFMIN && ["y", "v", "a"].every(k => a["g" + k] != null && GOPTS[k][+a["g" + k]].ok); }
  const RIDEGRAPHS = () => [["Position y (m)", -2, YMAX + 3, tt => rideAt(tt).y, css("--pos")], ["Velocity v (m/s)", -6, 6, tt => rideAt(tt).v, css("--vel")],
    ["Acceleration a (m/s²)", -3.5, 3.5, tt => rideAt(tt).a, css("--a")], ["Scale reading (N)", M * (G - 3.5), M * (G + 3.5), tt => M * (G + rideAt(tt).a), css("--fn"), FG]];
  const PHASELEGEND = RIDE.map((r, i) => `${i + 1} ${r[0].toLowerCase()}`).join(" · ");
  function drawRideGraphs(canvases) { RIDEGRAPHS().forEach((g, i) => plot(canvases[i], g[0], g[1], g[2], g[3], g[4], -1, RT, i >= 2, g[5], true)); }
  function reflectPrompt() {
    const w = wrongOrig();
    if (!A("data").revealed) return `<p>Make and lock in your predictions in section 1 first.</p>`;
    if (w.length) return `<p style="margin:0 0 6px">Some of your original predictions didn’t match: <b>${w.map(i => RD[i][0].toLowerCase()).join("; ")}</b>.</p>
      <p style="margin:0 0 6px"><b>How has your thinking changed after this activity? What caused your original confusion?</b></p>`;
    return `<p style="margin:0 0 6px">All of your original predictions were right!</p><p style="margin:0 0 6px"><b>Reflect on your overall experience with this interactive. Did it solidify your understanding or provide clarity? How?</b></p>`;
  }
  function renderSum() {
    const a = A("sum"), col = { y: "--pos", v: "--vel", a: "--a" }, nm = { y: "Position y vs. time", v: "Velocity v vs. time", a: "Acceleration a vs. time" };
    const gsvg = (k, o) => `<svg viewBox="0 0 200 100" aria-hidden="true"><line x1="5" y1="${k === "y" ? 80 : 50}" x2="195" y2="${k === "y" ? 80 : 50}" stroke="${css("--muted")}" stroke-width="1"/><line x1="5" y1="6" x2="5" y2="94" stroke="${css("--muted")}" stroke-width="1"/><path d="${o.d}" fill="none" stroke="${css(col[k])}" stroke-width="3"/></svg>`;
    let h = `<section class="panel card"><h2>Summarize</h2><h3>Complete the sentences</h3>${FILL.map((f, i) => `<p style="margin:6px 0">${f[0]} <select data-fill="${i}" style="${a["f" + i] ? `border-color:${a["f" + i] === f[1] ? "var(--ok)" : "var(--bad)"}` : ""}"><option value="">choose…</option>${["equal to", "greater than", "less than"].map(o => `<option ${a["f" + i] === o ? "selected" : ""}>${o}</option>`).join("")}</select> your actual weight.</p>`).join("")}
      <div class="q"><h3>Your predictions, revisited</h3>
        <p style="margin:0 0 6px">Here are your <b>original predictions</b> from the start. Now that you’ve worked through the elevator ride, choose your answers again.</p>
        <div style="overflow-x:auto"><table class="data"><thead><tr><th>Part of the ride</th><th>Your original prediction</th><th>Feel (now)</th><th>Acceleration (now)</th></tr></thead><tbody>
        ${REV.map((r, i) => { const d = A("data"), of = r.orig == null ? null : d["f" + r.orig], od = r.orig == null ? null : d["d" + r.orig], f = a["rf" + i], dd = a["rd" + i];
          const st = (v, okv) => v ? `border-color:${okv ? "var(--ok)" : "var(--bad)"}` : "";
          return `<tr><td>${r.label}</td><td class="hint">${r.orig == null ? "(not predicted)" : `${of || "-"}, ${({ up: "up (+)", zero: "zero", down: "down (−)" })[od] || "-"}`}</td>
            <td><select data-rf="${i}" aria-label="Feel now: ${r.label}" style="${st(f, f === r.feel)}"><option value="">choose…</option>${["heavier", "normal", "lighter", "weightless"].map(o => `<option ${f === o ? "selected" : ""}>${o}</option>`).join("")}</select></td>
            <td><select data-rd="${i}" aria-label="Acceleration now: ${r.label}" style="${st(dd, dd === r.dir)}"><option value="">choose…</option>${[["up", "Up (+)"], ["zero", "Zero"], ["down", "Down (−)"]].map(([v, t]) => `<option value="${v}" ${dd === v ? "selected" : ""}>${t}</option>`).join("")}</select></td></tr>`; }).join("")}
        </tbody></table></div>
        <p class="fb ${REV.every((r, i) => a["rf" + i] && a["rd" + i]) ? (REV.every((r, i) => revOK(a, i)) ? "ok" : "bad") : ""}">${REV.every((r, i) => a["rf" + i] && a["rd" + i]) ? (REV.every((r, i) => revOK(a, i)) ? "All correct!" : "Some answers are marked in red. Look back at the problems and the ride if you need to.") : ""}</p></div>
      <div class="q"><h3>Reflect</h3>${reflectPrompt()}
        <textarea id="refl" rows="6" style="width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)">${esc(a.refl || "")}</textarea>
        <p class="hint" id="reflcount" style="margin:4px 0 0"></p></div>
      <div class="q"><h3>The whole ride: up, stopped at the top, down</h3><p class="hint">Picture each graph first, then choose the one that matches. Each graph starts at rest at the bottom, and up is positive.</p>
      ${["y", "v", "a"].map(k => `<p style="margin:10px 0 4px"><b>${nm[k]}</b></p><div class="gchoice">${ORDER[k].map(oi => { const sel = a["g" + k] != null && +a["g" + k] === oi; return `<label class="${sel ? (GOPTS[k][oi].ok ? "right" : "wrong") : ""}"><input type="radio" name="g${k}" value="${oi}" ${sel ? "checked" : ""} class="sr-only" style="position:absolute;opacity:0">${gsvg(k, GOPTS[k][oi])}</label>`; }).join("")}</div>
        <p class="fb ${a["g" + k] != null ? (GOPTS[k][+a["g" + k]].ok ? "ok" : "bad") : ""}">${a["g" + k] != null ? (GOPTS[k][+a["g" + k]].ok ? "Correct!" : "Not quite. Compare with the graphs on the “Ride the elevator” page.") : ""}</p>`).join("")}</div>
      <div class="q"><h3>The ride’s motion graphs</h3>${["y", "v", "a"].every(k => a["g" + k] != null)
        ? `<p class="hint" style="margin:0 0 6px">Compare these with your choices above. Phases: ${PHASELEGEND}.</p>${["sgy", "sgv", "sga", "sgn"].map(id => `<canvas class="g" id="${id}" aria-label="Motion graph from the ride"></canvas>`).join("")}`
        : `<p class="hint">Choose all three graphs above, then the motion graphs from the ride appear here so you can compare.</p>`}</div>
      <p class="fb ok" id="sumdone">${sumDone() ? "Summary complete!" : ""}</p>${nextBtn("sum")}</section>`;
    $("main").innerHTML = h;
    $("main").querySelectorAll("[data-fill]").forEach(s => s.addEventListener("change", e => { a["f" + e.target.dataset.fill] = e.target.value; save(); renderSum(); renderNav(); }));
    const revUpdate = el => {
      const isF = el.dataset.rf != null, i = +(isF ? el.dataset.rf : el.dataset.rd), want = isF ? REV[i].feel : REV[i].dir;
      el.style.borderColor = el.value ? (el.value === want ? "var(--ok)" : "var(--bad)") : "";
      const fb = el.closest(".q").querySelector(".fb"), all = REV.every((r, j) => a["rf" + j] && a["rd" + j]), ok = REV.every((r, j) => revOK(a, j));
      fb.className = "fb " + (all ? (ok ? "ok" : "bad") : ""); fb.textContent = all ? (ok ? "All correct!" : "Some answers are marked in red. Look back at the problems and the ride if you need to.") : "";
      const sd = $("sumdone"); if (sd) sd.textContent = sumDone() ? "Summary complete!" : ""; renderNav(); };
    $("main").querySelectorAll("[data-rf]").forEach(sl => sl.addEventListener("change", e => { a["rf" + e.target.dataset.rf] = e.target.value; save(); revUpdate(e.target); }));
    $("main").querySelectorAll("[data-rd]").forEach(sl => sl.addEventListener("change", e => { a["rd" + e.target.dataset.rd] = e.target.value; save(); revUpdate(e.target); }));
    const count = () => { const n = (a.refl || "").trim().length; $("reflcount").textContent = n >= REFMIN ? "✓ Thanks for reflecting." : `Write a few sentences (${n} of at least ${REFMIN} characters).`; };
    $("refl").addEventListener("input", e => { a.refl = e.target.value; save(); count(); renderNav(); const done = $("sumdone"); if (done) done.textContent = sumDone() ? "Summary complete!" : ""; });
    count();
    if ($("sgy")) drawRideGraphs(["sgy", "sgv", "sga", "sgn"].map(id => $(id)));
    $("main").querySelectorAll("input[name^=g]").forEach(r => r.addEventListener("change", e => { a[e.target.name] = e.target.value; save(); renderSum(); renderNav(); }));
  }

  // ---------- start: name and period ----------
  function renderStart() {
    $("main").innerHTML = `<section class="panel card"><h2>Before you start</h2><p>Your name and class period go on the PDF you’ll turn in on Canvas at the end. Check them carefully: <b>you can’t change them later.</b></p>
      <div class="bar"><label>Name <input type="text" id="nm" value="${esc(S.name)}" autocomplete="name" style="min-width:220px"></label><label>Period <input type="text" id="pd" value="${esc(S.period || "")}" style="width:6ch"></label>
        <button class="btn" id="start">Start</button></div><p class="fb bad" id="sfb"></p></section>`;
    const go1 = () => { const n = $("nm").value.trim(), pd = $("pd").value.trim(); if (n.length < 2 || !pd) { $("sfb").textContent = "Enter your name and class period."; return; } S.name = n; S.period = pd; save(); render(); };
    $("start").addEventListener("click", go1); ["nm", "pd"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") go1(); }));
  }
  // ---------- finish ----------
  function renderFinish() {
    const all = SECS.filter(s => s.id !== "finish"), done = all.filter(s => secDone(s.id)).length, complete = done === all.length;
    if (complete && !S.finished) { S.finished = new Date().toISOString(); save(); }
    $("main").innerHTML = `<section class="panel card ${complete ? "done-hero" : ""}">${complete ? `<div class="big" aria-hidden="true">✓</div>` : ""}<h2 style="${complete ? "" : ""}">${complete ? "Apparent weight: complete" : "Almost there"}</h2>
      <p><b>Name:</b> ${esc(S.name)} &nbsp;&nbsp; <b>Period:</b> ${esc(S.period || "")}</p>
      ${complete ? `<p>Finished ${new Date(S.finished).toLocaleDateString()} at ${new Date(S.finished).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</p>` : `<p>${done} of ${all.length} sections complete. Finish the ones marked ○.</p>`}
      <div class="donelist">${all.map(s => `<span class="${secDone(s.id) ? "y" : "n"}">${esc(s.title)}</span>`).join("")}</div>
      <div class="bar" style="justify-content:center;margin-top:8px"><button class="btn" id="pdf">Download PDF for Canvas</button></div>
      <p class="hint">${complete ? "Upload the PDF to your Canvas assignment." : "You can download a PDF now, but it will show the sections that aren’t finished yet."}</p></section>`;
    $("pdf").addEventListener("click", makePDF);
  }

  // ---------- PDF for Canvas ----------
  function makePDF() {
    const plain = x => String(x == null ? "" : x).replace(/<[^>]+>/g, "").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[–—]/g, "-").replace(/−/g, "-").replace(/…/g, "...").replace(/[^\x00-\xff]/g, "");
    if (!window.jspdf) { window.print(); return; }
    const doc = new window.jspdf.jsPDF({ unit: "pt", format: "letter" }), PW = 612, Mg = 54, TW = PW - 2 * Mg; let y = Mg;
    const need = h => { if (y + h > 792 - Mg) { doc.addPage(); y = Mg; } };
    const text = (t, size = 10.5, bold = false, color = [20, 30, 35], x = Mg) => { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      doc.splitTextToSize(plain(t), TW - (x - Mg)).forEach(l => { need(size * 1.4); doc.text(l, x, y + size); y += size * 1.4; }); };
    const ok = b => b ? [26, 127, 55] : [180, 35, 24];
    const all = SECS.filter(x => x.id !== "finish"), done = all.filter(x => secDone(x.id)).length;
    text("Apparent Weight in an Elevator", 17, true);
    text(`Name: ${S.name}     Period: ${S.period || ""}     Mass used: ${M} kg     Downloaded: ${new Date().toLocaleString()}`, 10.5);
    text(`Sections complete: ${done} of ${all.length}${S.finished ? "  (finished " + new Date(S.finished).toLocaleString() + ")" : ""}`, 10.5, true, ok(done === all.length)); y += 6;
    // 1. predictions
    const d = A("data"); text(`1. Predictions: elevator ride up and down (${M} kg student)`, 13, true, [31, 111, 180]);
    text(`Weight calculation (Fg = mg): first answer ${d.wFirst || "-"} N${d.wFirst != null ? (Math.abs(parse(d.wFirst) - FG) <= 0.6 ? " (correct)" : " (incorrect)") : ""}${d.wOK ? `; final ${WS()} N (correct)` : ""}`, 10, false, d.wOK ? ok(true) : [20, 30, 35], Mg + 10); text(d.revealed ? "The student's original predictions, as locked in:" : "Predictions not locked in yet:", 9.5, false, [90, 100, 105], Mg + 10);
    RD.forEach((r, i) => text(`${r[0]}: predicted ${d["f" + i] || "-"}, acceleration ${({ up: "up (+)", zero: "zero", down: "down (-)" })[d["d" + i]] || "-"}`, 10, false, [20, 30, 35], Mg + 10));
    y += 6;
    // 2-10. problems
    P.forEach((p, i) => {
      const a = A(p.id); need(70); text(`${i + 2}. ${p.title} (${p.group})`, 12, true, [31, 111, 180]);
      const vals = p.known === "N" ? `a = ${a.va || "-"} m/s^2` : p.known === "a" ? `FN = ${a.vN || "-"} N` : `a = ${a.va || "-"} m/s^2, FN = ${a.vN || "-"} N`;
      if (p.id === "p1") text(`Interaction diagram: ${IDOBJ.map(([o]) => `${o}: ${(a.id || {})[o] || "-"}`).join(", ")}${a.idTried ? (a.idOK ? " (correct)" : " (incorrect)") : ""}`, 10, false, a.idTried ? ok(a.idOK) : [20, 30, 35], Mg + 10);
      const Lp = p.id === "p1" ? { fbd: "a", dir: "b", cmp: "c", val: "d", vt: "e" } : { dir: "a", cmp: "b", val: "c", fbd: "d", vt: "e" };
      const lines = {
        dir: () => { text(`${Lp.dir}. Acceleration direction: ${a.dir || "-"}${a.dir ? (a.dirOK ? " (correct)" : " (incorrect)") : ""}`, 10, false, a.dir ? ok(a.dirOK) : [20, 30, 35], Mg + 10); },
        cmp: () => { text(`${Lp.cmp}. FN compared with Fg: ${({ greater: "FN > Fg", equal: "FN = Fg", less: "FN < Fg" })[a.cmp] || "-"}${a.cmp ? (a.cmpOK ? " (correct)" : " (incorrect)") : ""}`, 10, false, a.cmp ? ok(a.cmpOK) : [20, 30, 35], Mg + 10); },
        val: () => { text(`${Lp.val}. ${vals}${a.vTried ? (a.valOK ? " (correct)" : " (incorrect)") : ""}`, 10, false, a.vTried ? ok(a.valOK) : [20, 30, 35], Mg + 10); },
        fbd: () => { text(`${Lp.fbd}. Force diagram: ${(a.fbd || []).filter(f => f.type).map(f => `F_${f.type || "?"}, on student, by ${f.by || "?"}: ${f.dir || "?"}, ${f.mag || "?"} N`).join("; ") || "-"}${a.fbdTried ? (a.fbdOK ? " (correct)" : " (incorrect)") : ""}`, 10, false, a.fbdTried ? ok(a.fbdOK) : [20, 30, 35], Mg + 10); },
        vt: () => { text(`${Lp.vt}. Velocity vs. time graph: ${VT[a.vt] || "-"}${a.vt ? (a.vtOK ? " (correct)" : " (incorrect)") : ""}`, 10, false, a.vt ? ok(a.vtOK) : [20, 30, 35], Mg + 10); },
      };

    });

    const dd = A("data"), dirW = { up: "up (+)", zero: "zero", down: "down (-)" };
    REV.forEach((r, i) => text(`${r.label}: ${r.orig == null ? "(not predicted)" : `${dd["f" + r.orig] || "-"}, ${dirW[dd["d" + r.orig]] || "-"}`} -> ${su["rf" + i] || "-"}, ${dirW[su["rd" + i]] || "-"}${su["rf" + i] && su["rd" + i] ? (revOK(su, i) ? " (correct)" : " (incorrect)") : ""}`, 10, false, su["rf" + i] && su["rd" + i] ? ok(revOK(su, i)) : [20, 30, 35], Mg + 20));
    y += 4; const w = wrongOrig();
    text(w.length ? `Reflection (original predictions that didn't match: ${w.map(i => RD[i][0].toLowerCase()).join("; ")}):` : "Reflection (all original predictions matched):", 10, true, [20, 30, 35], Mg + 10);
    text((su.refl || "").trim() || "(no reflection written)", 10, false, [20, 30, 35], Mg + 20);
    ["y", "v", "a"].forEach(k => { const v = su["g" + k]; text(`Whole-ride ${({ y: "position", v: "velocity", a: "acceleration" })[k]} vs. time graph: ${v == null ? "not chosen" : GOPTS[k][+v].ok ? "correct" : "incorrect"}`, 10, false, v == null ? [20, 30, 35] : ok(GOPTS[k][+v].ok), Mg + 10); });
    // the ride's motion graphs
    const de = document.documentElement, prev = de.getAttribute("data-theme"); de.setAttribute("data-theme", "light");
    const cvs = [0, 1, 2, 3].map(() => { const c = document.createElement("canvas"); c.style.cssText = "position:absolute;left:-9999px;top:0;width:640px;height:130px"; document.body.appendChild(c); return c; });
    drawRideGraphs(cvs);
    const imgs = cvs.map(c => { const o = document.createElement("canvas"); o.width = c.width; o.height = c.height; const x = o.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, o.width, o.height); x.drawImage(c, 0, 0); c.remove(); return o.toDataURL("image/png"); });
    if (prev) de.setAttribute("data-theme", prev); else de.removeAttribute("data-theme");
    need(40); y += 8; text("The elevator ride's motion graphs", 12, true, [31, 111, 180]); text("Phases: " + plain(PHASELEGEND), 8.5, false, [90, 100, 105], Mg + 10);
    imgs.forEach(im => { const h = TW * 130 / 640; need(h + 6); doc.addImage(im, "PNG", Mg, y, TW, h); y += h + 6; });
    doc.save(`Apparent-Weight-${plain(S.name).replace(/[^A-Za-z0-9]+/g, "-")}-P${plain(S.period).replace(/[^A-Za-z0-9]+/g, "")}.pdf`);
  }
  addEventListener("resize", () => { if (S.sec === "ride") { const v = $("rt"); if (v) v.dispatchEvent(new Event("input")); } });
  render();
})();
</script>
<!-- lock check: hides this interactive until the teacher opens it (settings in ../availability.json) -->
<script>
(function () {
  var id = location.pathname.split("/").pop().replace(".html", "");
  fetch("../availability.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (cfg) {
      if (!cfg || !cfg.labs || cfg.labs[id] !== false) return;
      var teacher = false; try { teacher = localStorage.getItem("teacherPreview") === "1"; } catch (e) {}
      var font = "font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;";
      if (teacher) {
        var b = document.createElement("div");
        b.setAttribute("role", "status");
        b.style.cssText = font + "position:sticky;top:0;z-index:50;background:#7a3fe0;color:#fff;font-weight:700;text-align:center;padding:8px 12px;";
        b.textContent = "Teacher preview: this interactive is locked for students.";
        document.body.prepend(b);
        return;
      }
      var o = document.createElement("div");
      o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-labelledby", "lockTitle");
      o.style.cssText = font + "position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:var(--bg,#eaf1ee);";
      o.innerHTML = '<div style="max-width:520px;background:var(--panel,#fff);color:var(--ink,#15232b);border:1px solid var(--line,#c4d3cc);border-radius:12px;padding:28px;text-align:center">' +
        '<h1 id="lockTitle" style="margin:0 0 8px;font-size:1.6rem">Not open yet</h1>' +
        '<p style="margin:0 0 18px;line-height:1.5">This interactive opens after we do the class activity that goes with it. Check back then!</p>' +
        '<a href="../interactives.html" style="display:inline-block;font-weight:700;padding:8px 18px;border-radius:8px;background:var(--ink,#15232b);color:var(--panel,#fff);text-decoration:none">Back to Interactives</a></div>';
      document.body.appendChild(o);
      document.documentElement.style.overflow = "hidden";
      Array.prototype.forEach.call(document.body.children, function (el) { if (el !== o) el.setAttribute("aria-hidden", "true"); });
    })
    .catch(function () {});
})();
