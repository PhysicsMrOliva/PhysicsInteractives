<style>

canvas.g { width: 100%; height: 118px; display: block; background: var(--tint); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }

.gchoice label:has(input:checked) { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc) inset; }
.gchoice label.right { border-color: var(--ok); background: var(--okbg); } .gchoice label.wrong { border-color: var(--bad); background: var(--badbg); }
.gchoice svg { width: 100%; height: 90px; }

.donelist span.y::before { content: "✓ "; color: var(--ok); font-weight: 700; } .donelist span.n::before { content: "○ "; color: var(--muted); }
.hidden { display: none !important; }

<body>
<header>
  <a class="back" href="../interactives.html">Back to Interactives</a>
  <h1>Apparent weight in an elevator</h1>
  <p>Why do you feel heavier or lighter in an elevator? A bathroom scale measures the <b>normal force</b> pushing up on you, your <b>apparent weight</b>. Use <b>g = 9.81 N/kg</b>, ΣF = F<sub>net</sub>, and Newton’s 2nd Law, F<sub>net</sub> = ma. Take <b>up as positive</b>.</p>
</header>
<div class="wrap">
  <nav class="panel side" aria-label="Sections"><ol id="nav"></ol></nav>
  <main id="main"></main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const G = 9.81, M = 70, FG = M * G;   // 686.7 N
  const fmtN = v => Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1);
  const fmt = (v, d = 1) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
  const parse = s => Number(String(s).trim().replace("−", "-").replace(",", ".").replace(/\s*(m\/s²|m\/s2|n)$/i, ""));

  // ---------- the nine moments (70 kg teacher, Fg = (70 kg)(9.81 N/kg) = 686.7 N) ----------
  // v: direction of motion (1 up, -1 down, 0 at rest), a: acceleration (m/s², up +), N: scale reading
  const P = [
    { id: "p1", title: "At rest at the bottom", group: "Going up", v: 0, a: 0, N: FG, known: "N", text: "The elevator is at rest at the bottom and hasn’t started moving yet. The scale shows a normal force of <b>686.7 N</b> on the teacher. Find the acceleration.", vt: "zero" },
    { id: "p2", title: "Starting to go up", group: "Going up", v: 1, a: 2.2, N: FG + M * 2.2, known: "N", text: "The elevator has just started to <b>accelerate upward</b>, and the scale pushes up with a normal force of <b>840.7 N</b>. Find the acceleration.", vt: "upFaster" },
    { id: "p3", title: "Constant velocity up", group: "Going up", v: 1, a: 0, N: FG, known: "a", text: "The elevator is moving at a <b>constant velocity</b> as it rises. Find the normal force shown on the scale.", vt: "upConst" },
    { id: "p4", title: "Slowing down going up", group: "Going up", v: 1, a: -2.2, N: FG - M * 2.2, known: "a", text: "The elevator is still moving up but has just started to <b>slow down at a rate of 2.2 m/s²</b> as it approaches the top floor. Find the normal force shown on the scale.", vt: "upSlower" },
    { id: "p5", title: "Stopped at the top", group: "Going up", v: 0, a: 0, N: FG, known: "N", text: "The elevator has just stopped at the top floor. The scale shows a normal force of <b>686.7 N</b>. Find the acceleration.", vt: "zero" },
    { id: "p7", title: "Starting to go down", group: "Going down", v: -1, a: -2.2, N: FG - M * 2.2, known: "N", text: "The elevator has just started to <b>accelerate downward</b> from the top floor, and the scale pushes up on the teacher with a normal force of <b>532.7 N</b>. Find the acceleration.", vt: "downFaster" },
    { id: "p8", title: "Constant velocity down", group: "Going down", v: -1, a: 0, N: FG, known: "a", text: "The elevator is moving at a <b>constant velocity</b> as it descends. Find the normal force shown on the scale.", vt: "downConst" },
    { id: "p9", title: "Slowing down going down", group: "Going down", v: -1, a: 2.2, N: FG + M * 2.2, known: "N", text: "The elevator is moving down but slowing as it approaches the 1st floor. The scale reads a normal force of <b>840.7 N</b>. Find the acceleration.", vt: "downSlower" },
    { id: "p6", title: "What if the cable snapped?", group: "What if…?", v: -1, a: -G, N: 0, known: "free", text: "Let’s suppose that instead of being lowered from the top, the cable <b>snapped</b>! The elevator, the teacher and the scale are all in <b>free fall</b>. Find the acceleration and the normal force the scale shows.", vt: "downFaster" }
  ];
  const VT = { zero: "At rest (v = 0)", upFaster: "Up, speeding up", upConst: "Up, constant speed", upSlower: "Up, slowing down", downFaster: "Down, speeding up", downConst: "Down, constant speed", downSlower: "Down, slowing down" };
  const vtPath = k => ({ zero: "M8 35 H102", upFaster: "M8 35 L102 8", upConst: "M8 18 H102", upSlower: "M8 8 L102 35", downFaster: "M8 35 L102 62", downConst: "M8 52 H102", downSlower: "M8 62 L102 35" }[k]);
  const vtSVG = k => `<svg viewBox="0 0 110 70" aria-hidden="true"><line x1="8" y1="35" x2="106" y2="35" stroke="${css("--muted")}" stroke-width="1"/><line x1="8" y1="4" x2="8" y2="66" stroke="${css("--muted")}" stroke-width="1"/>
    <text x="1" y="12" font-size="9" fill="${css("--muted")}">+</text><text x="2" y="66" font-size="9" fill="${css("--muted")}">−</text><path d="${vtPath(k)}" stroke="${css("--vel")}" stroke-width="3" fill="none"/></svg>`;

  // ---------- saved progress ----------
  const KEY = "apparent-weight-v1";
  let S = { name: "", period: "", sec: "data", a: {}, finished: null };
  try { const x = JSON.parse(localStorage.getItem(KEY) || "null"); if (x && x.a) S = x; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const A = id => (S.a[id] = S.a[id] || {});

  // ---------- sections ----------
  const SECS = [{ id: "data", title: "1. Predict: up and down" }, ...P.map((p, i) => ({ id: p.id, title: `${i + 2}. ${p.title}` })),
    { id: "ride", title: "11. Ride the elevator" }, { id: "sum", title: "12. Summarize" }, { id: "finish", title: "Finish" }];
  const secDone = id => id === "data" ? dataDone() : id === "ride" ? !!A("ride").seen : id === "sum" ? sumDone() : id === "finish" ? false : probDone(P.find(p => p.id === id));
  function renderNav() {
    $("nav").innerHTML = SECS.map(s => `<li><button data-s="${s.id}" ${S.sec === s.id ? 'aria-current="page"' : ""} class="${secDone(s.id) ? "done" : ""}">${s.title}</button></li>`).join("");
  }
  $("nav").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) go(b.dataset.s); });
  function go(id) { S.sec = id; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  const nextBtn = id => { const i = SECS.findIndex(s => s.id === id), n = SECS[i + 1]; return n ? `<div class="bar" style="margin-top:16px"><button class="btn" data-go="${n.id}">Next: ${esc(n.title.replace(/^\d+\.\s*/, ""))} ▶</button></div>` : ""; };
  let stopAnim = null;
  function render() {
    if (stopAnim) { stopAnim(); stopAnim = null; }
    renderNav();
    const id = S.sec;
    if (!S.name.trim() || !(S.period || "").trim()) { renderStart(); return; }
    if (id === "data") renderData(); else if (id === "ride") renderRide(); else if (id === "sum") renderSum(); else if (id === "finish") renderFinish(); else renderProb(P.find(p => p.id === id));
    $("main").querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  }
  const choice = (name, opts, val, mark) => `<div class="choices">${opts.map(([v, t]) => `<label class="${mark && val === v ? (mark === v ? "right" : "wrong") : ""}"><input type="radio" name="${name}" value="${v}" ${val === v ? "checked" : ""}> <span>${t}</span></label>`).join("")}</div>`;

  const RIDE = [["At rest", 1.5, 0], ["Speeding up, going up", 2, 2.2], ["Constant velocity up", 4, 0], ["Slowing down, going up", 2, -2.2], ["Stopped at the top", 2, 0],
    ["Speeding up, going down", 2, -2.2], ["Constant velocity down", 4, 0], ["Slowing down, going down", 2, 2.2], ["Stopped at the bottom", 1.5, 0]];
  const RT = RIDE.reduce((t, r) => t + r[1], 0);
  function rideAt(t) {   // y, v, a, phase index
    let y = 0, v = 0, tt = 0;
    for (let i = 0; i < RIDE.length; i++) { const [, d, a] = RIDE[i];
      if (t <= tt + d) { const u = t - tt; return { y: y + v * u + 0.5 * a * u * u, v: v + a * u, a, i }; }
      y += v * d + 0.5 * a * d * d; v += a * d; tt += d; }
    return { y, v, a: 0, i: RIDE.length - 1 };
  }
  const YMAX = rideAt(13.5).y;
  // ---------- 1. predictions ----------
  const RD = [["At rest at the bottom", FG, "normal"], ["Starting to go up", FG + M * 2.2, "heavier"], ["Constant velocity up", FG, "normal"], ["Slowing down moving up", FG - M * 2.2, "lighter"], ["Stopped at the top", FG, "normal"],
    ["Starting to go down", FG - M * 2.2, "lighter"], ["Constant velocity down", FG, "normal"], ["Slowing down moving down", FG + M * 2.2, "heavier"], ["Stopped at the bottom", FG, "normal"]];   // N = m(g + a)
  const RDIR = { heavier: "up", normal: "zero", lighter: "down" };
  const DIRS = [["up", "Up (+)"], ["zero", "Zero"], ["down", "Down (−)"]];
  const rdOK = (a, i) => a["f" + i] === RD[i][2] && a["d" + i] === RDIR[RD[i][2]];
  function dataDone() { const a = A("data"); return !!a.revealed && RD.every((r, i) => rdOK(a, i)); }
  function renderData() {
    if (stopAnim) { stopAnim(); stopAnim = null; }
    const a = A("data"), rev = !!a.revealed, all = RD.every((r, i) => a["f" + i] && a["d" + i]);
    const mark = (ok, v) => !rev || !v ? "" : `border-color:${ok ? "var(--ok)" : "var(--bad)"}`;
    $("main").innerHTML = `<section class="panel card"><h2>Predict: an elevator ride up and down</h2>
      <p>A 70 kg student stands on a force scale during an elevator ride up to the top floor and back down. Their <b>actual weight is (70 kg)(9.81 N/kg) = 686.7 N</b>. The scale measures their <b>apparent weight</b>: how hard the scale pushes up on them.</p>
      <div class="probtop" style="margin:10px 0"><div><div id="upelev"></div><div class="bar" style="margin-top:8px"><button class="btn" id="upplay">▶ Play</button><button class="btn ghost" id="upreset">⟲ Replay</button></div></div>
        <div><p style="margin-top:0">Watch the ride up and back down. The red arrow shows which way the elevator is moving.</p><p class="readout" id="upread" style="margin:6px 0"></p>
        ${rev ? `<p class="hint">Now the scale shows its readings, and the blue arrow shows the acceleration.</p>` : `<p class="hint">The scale reading and the acceleration are hidden until you check your predictions.</p>`}
        <p><b>Predict</b> for each part of the ride: will they feel heavier, normal or lighter? And which way does the acceleration point? (Up is positive.)</p></div></div>
      <div style="overflow-x:auto"><table class="data"><thead><tr><th>Part of the ride</th><th>They will feel…</th><th>Acceleration points…</th>${rev ? "<th>Scale reading</th>" : ""}</tr></thead><tbody>
      ${RD.map((r, i) => { const f = a["f" + i], d = a["d" + i];
        return `<tr><td>${r[0]}</td>
          <td><select data-f="${i}" aria-label="How they will feel: ${r[0]}" style="${mark(f === r[2], f)}"><option value="">predict…</option>${["heavier", "normal", "lighter"].map(o => `<option ${f === o ? "selected" : ""}>${o}</option>`).join("")}</select></td>
          <td><select data-d="${i}" aria-label="Direction of the acceleration: ${r[0]}" style="${mark(d === RDIR[r[2]], d)}"><option value="">predict…</option>${DIRS.map(([v, t]) => `<option value="${v}" ${d === v ? "selected" : ""}>${t}</option>`).join("")}</select></td>
          ${rev ? `<td><b>${r[1].toFixed(1)} N</b> <span class="hint">(${Math.abs(r[1] - FG) < 0.05 ? "the same as 686.7 N" : r[1] > FG ? "more than 686.7 N" : "less than 686.7 N"})</span>${rdOK(a, i) ? " ✓" : ""}</td>` : ""}</tr>`; }).join("")}
      </tbody></table></div>
      ${rev ? "" : `<div class="bar" style="margin-top:12px"><button class="btn" id="reveal" ${all ? "" : "disabled"}>Check my predictions</button><span class="hint">${all ? "" : "Make all 18 predictions first."}</span></div>`}
      ${rev ? `
        <div class="work"><b>What the readings show:</b> more than 686.7 N means the acceleration points <b>up</b> and they feel <b>heavier</b>: speeding up going up, or slowing down going down. Less than 686.7 N means the acceleration points <b>down</b> and they feel <b>lighter</b>: slowing down going up, or speeding up going down. At rest and at <b>constant velocity</b> (up or down) the reading equals their weight: <b>no acceleration</b>, so they feel normal, even while moving.</div>
        <p class="fb ${dataDone() ? "ok" : "bad"}" id="dfb">${dataDone() ? "Your predictions now match the scale readings. Next, you’ll calculate the accelerations for a 70 kg teacher." : "Update any prediction marked in red so it matches the data."}</p>` : ""}

    FILL.forEach((f, i) => text(`${f[0]} ${su["f" + i] || "____"} your actual weight.`, 10, false, su["f" + i] ? ok(su["f" + i] === f[1]) : [20, 30, 35], Mg + 10));
    SORTS.forEach((x, i) => text(`${x[0]}: feel ${su["s" + i] || "-"}`, 10, false, su["s" + i] ? ok(su["s" + i] === x[1]) : [20, 30, 35], Mg + 10));
    ["y", "v", "a"].forEach(k => { const v = su["g" + k]; text(`Whole-ride ${({ y: "position", v: "velocity", a: "acceleration" })[k]} vs. time graph: ${v == null ? "not chosen" : GOPTS[k][+v].ok ? "correct" : "incorrect"}`, 10, false, v == null ? [20, 30, 35] : ok(GOPTS[k][+v].ok), Mg + 10); });
    doc.save(`Apparent-Weight-${plain(S.name).replace(/[^A-Za-z0-9]+/g, "-")}-P${plain(S.period).replace(/[^A-Za-z0-9]+/g, "")}.pdf`);
  }
  addEventListener("resize", () => { if (S.sec === "ride") { const v = $("rt"); if (v) v.dispatchEvent(new Event("input")); } });
  render();
})();
</script>
<!-- lock check: hides this interactive until the teacher opens it (settings in ../availability.json) -->
<script>
(function () {
  var id = location.pathname.split("/").pop().replace(".html", "");
  fetch("../availability.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (cfg) {
      if (!cfg || !cfg.labs || cfg.labs[id] !== false) return;
      var teacher = false; try { teacher = localStorage.getItem("teacherPreview") === "1"; } catch (e) {}
      var font = "font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;";
      if (teacher) {
        var b = document.createElement("div");
        b.setAttribute("role", "status");
        b.style.cssText = font + "position:sticky;top:0;z-index:50;background:#7a3fe0;color:#fff;font-weight:700;text-align:center;padding:8px 12px;";
        b.textContent = "Teacher preview: this interactive is locked for students.";
        document.body.prepend(b);
        return;
      }
      var o = document.createElement("div");
      o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-labelledby", "lockTitle");
      o.style.cssText = font + "position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;background:var(--bg,#eaf1ee);";
      o.innerHTML = '<div style="max-width:520px;background:var(--panel,#fff);color:var(--ink,#15232b);border:1px solid var(--line,#c4d3cc);border-radius:12px;padding:28px;text-align:center">' +
        '<h1 id="lockTitle" style="margin:0 0 8px;font-size:1.6rem">Not open yet</h1>' +
        '<p style="margin:0 0 18px;line-height:1.5">This interactive opens after we do the class activity that goes with it. Check back then!</p>' +
        '<a href="../interactives.html" style="display:inline-block;font-weight:700;padding:8px 18px;border-radius:8px;background:var(--ink,#15232b);color:var(--panel,#fff);text-decoration:none">Back to Interactives</a></div>';
      document.body.appendChild(o);
      document.documentElement.style.overflow = "hidden";
      Array.prototype.forEach.call(document.body.children, function (el) { if (el !== o) el.setAttribute("aria-hidden", "true"); });
    })
    .catch(function () {});
})();
</script>
